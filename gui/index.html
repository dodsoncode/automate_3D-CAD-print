<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Walker Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=JetBrains+Mono:wght@500&family=Nunito:wght@500;700&display=swap">
<style>
/* Layout: sticky 3D workbench on the left, tabbed control panel on the right; stacks on phones with the 3D view pinned on top. */
:root {
  --bg: #e9eff6;
  --surface: #ffffff;
  --surface2: #f3f7fb;
  --ink: #14213d;
  --muted: #55657f;
  --line: #cfd9e6;
  --accent: #f0640f;
  --accent-ink: #ffffff;
  --sky: #2a7de1;
  --ok: #17803f;
  --warn: #a96b00;
  --bad: #c62828;
  --ok-bg: #dff4e6;
  --warn-bg: #fdf0cf;
  --bad-bg: #fbdcdc;
  --view-bg: #dfe8f2;
  --grid1: #aebdd0;
  --grid2: #c6d2e0;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1424; --surface: #15213a; --surface2: #1b2a47; --ink: #e8eefb; --muted: #9db0cf; --line: #2b3d60;
    --accent: #ff8a3d; --accent-ink: #1a0d00; --sky: #6aa8ff; --ok: #5ed38b; --warn: #f2c14e; --bad: #ff7b7b;
    --ok-bg: #123524; --warn-bg: #3b2f0e; --bad-bg: #421a1a; --view-bg: #101b30; --grid1: #2e4268; --grid2: #1f3052;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1424; --surface: #15213a; --surface2: #1b2a47; --ink: #e8eefb; --muted: #9db0cf; --line: #2b3d60;
  --accent: #ff8a3d; --accent-ink: #1a0d00; --sky: #6aa8ff; --ok: #5ed38b; --warn: #f2c14e; --bad: #ff7b7b;
  --ok-bg: #123524; --warn-bg: #3b2f0e; --bad-bg: #421a1a; --view-bg: #101b30; --grid1: #2e4268; --grid2: #1f3052;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-block: 14px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.app { max-width: 1280px; margin: 0 auto; display: grid; gap: 14px; }
header.top { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.brand h1 { font-size: 1.7rem; letter-spacing: 0.01em; }
.namebox { display: flex; align-items: center; gap: 8px; min-width: 0; }
.namebox label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.namebox input { background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 6px 10px; width: 14ch; min-width: 0; font-weight: 700; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.presets span.lbl { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.chip { background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 5px 13px; font-weight: 700; font-size: 0.92rem; }
.chip:hover { border-color: var(--sky); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.styles { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.stylecard { text-align: left; display: grid; gap: 2px; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; min-width: 0; }
.stylecard b { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; }
.stylecard .sub { font-family: var(--font-mono); font-size: 0.78rem; color: var(--sky); }
.stylecard .blurb { font-size: 0.88rem; color: var(--muted); }
.stylecard:hover { border-color: var(--sky); }
.stylecard[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.main { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(340px, 0.9fr); gap: 16px; align-items: start; }
.stage { position: sticky; top: 10px; background: var(--view-bg); border: 2px solid var(--line); border-radius: 18px; overflow: hidden; height: min(760px, calc(100vh - 20px)); min-height: 380px; }
#view { position: absolute; inset: 0; }
#view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.stage .bar { position: absolute; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
.stage .bar > * { pointer-events: auto; }
.stage .bar.topbar { top: 10px; justify-content: space-between; }
.stage .bar.botbar { bottom: 10px; }
.btn { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 7px 13px; font-weight: 700; }
.btn:hover { border-color: var(--sky); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-size: 1.05rem; padding: 11px 20px; }
.btn.primary:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.seg button { background: transparent; border: 0; padding: 7px 12px; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.status { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 6px 14px; font-weight: 800; border: 2px solid transparent; }
.status.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.status.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.status.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.dot { width: 14px; height: 14px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; font-size: 10px; font-weight: 800; line-height: 1; color: #fff; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.dot.ok::after { content: "\2713"; } .dot.warn::after { content: "!"; } .dot.bad::after { content: "\00d7"; font-size: 13px; }
:root[data-theme="dark"] .dot, :root:not([data-theme="light"]) .dot { color: #0c1424; }
.dims { position: absolute; left: 12px; top: 58px; font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); background: color-mix(in srgb, var(--surface) 85%, transparent); border-radius: 8px; padding: 4px 8px; }

.panel { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; min-width: 0; }
.tabs { display: flex; gap: 4px; padding: 8px; border-bottom: 2px solid var(--line); overflow-x: auto; }
.tabs button { background: transparent; border: 0; border-radius: 10px; padding: 8px 12px; font-family: var(--font-display); font-weight: 500; font-size: 1.02rem; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tabs .dot { width: 12px; height: 12px; font-size: 9px; }
section.tab { padding: 14px 16px 18px; display: grid; gap: 14px; }
[hidden] { display: none !important; }
section.tab[hidden] { display: none; }
.intro { color: var(--muted); margin: 0; font-size: 0.95rem; }
.row { display: grid; gap: 4px; }
.row .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.row label { font-weight: 800; }
.row output { font-family: var(--font-mono); font-size: 0.95rem; background: var(--surface2); border-radius: 8px; padding: 1px 8px; white-space: nowrap; }
.row .hint { color: var(--muted); font-size: 0.86rem; }
input[type=range] { width: 100%; height: 34px; accent-color: var(--accent); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.field { display: grid; gap: 3px; min-width: 0; }
.field label { font-size: 0.85rem; font-weight: 700; }
.field input, .field select, .row select { background: var(--surface2); border: 2px solid var(--line); border-radius: 10px; padding: 7px 9px; width: 100%; min-width: 0; font-family: var(--font-mono); font-size: 0.92rem; }
.row select { font-family: var(--font-body); font-weight: 700; }
fieldset { border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px 12px; margin: 0; display: grid; gap: 10px; min-width: 0; }
legend { font-family: var(--font-display); padding: 0 6px; font-size: 1.02rem; }
.swatches { display: flex; flex-wrap: wrap; gap: 7px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--line); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); }
.slotline { display: grid; gap: 6px; }
.slotline .nm { display: flex; align-items: center; gap: 8px; font-weight: 800; }
.chipc { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--line); flex: none; }
.assign { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.checks { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.checks li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; background: var(--surface2); border-radius: 12px; padding: 9px 12px; }
.checks li .dot { margin-top: 4px; }
.checks b { display: block; }
.checks span { color: var(--muted); font-size: 0.9rem; }
.tabchecks { border-top: 2px dashed var(--line); padding-top: 12px; }
.tabchecks h3 { font-size: 0.95rem; color: var(--muted); margin-bottom: 8px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { background: var(--surface2); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--font-mono); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.82rem; color: var(--muted); }
pre.code { margin: 0; background: var(--surface2); border-radius: 12px; padding: 10px 12px; font-family: var(--font-mono); font-size: 0.85rem; overflow-x: auto; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.note { font-size: 0.9rem; color: var(--muted); margin: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-weight: 700; z-index: 30; max-width: calc(100vw - 32px); }
.toast[hidden] { display: none; }
.fallback { padding: 30px; text-align: center; color: var(--muted); }
@media (max-width: 900px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .stage { top: env(safe-area-inset-top, 0px); height: 44vh; min-height: 280px; z-index: 5; border-radius: 14px; }
  .brand h1 { font-size: 1.4rem; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Walker Designer</h1>
      <div class="namebox"><label for="rname">Robot name</label><input id="rname" type="text" maxlength="24" autocomplete="off"></div>
    </div>
    <div class="presets" id="presets"><span class="lbl">Start from</span></div>
  </header>
  <div class="styles" id="styles" role="radiogroup" aria-label="Robot style"></div>

  <div class="main">
    <div class="stage" id="stage">
      <div id="view"><div class="fallback" id="nogl" hidden>The 3D view needs WebGL. Try a different browser.</div></div>
      <div class="bar topbar">
        <span class="status ok" id="status" role="status" aria-live="polite"></span>
        <div class="seg" id="viewmode" role="group" aria-label="What to show">
          <button type="button" data-mode="robot" aria-pressed="true">Robot</button>
          <button type="button" data-mode="plates" aria-pressed="false">Print plates</button>
        </div>
      </div>
      <div class="bar botbar" id="botbar">
        <button type="button" class="btn on" id="walk" aria-pressed="true">Walking</button>
        <div class="seg" id="cam" role="group" aria-label="Camera">
          <button type="button" data-cam="angle" aria-pressed="true">Angle</button>
          <button type="button" data-cam="top" aria-pressed="false">Top</button>
          <button type="button" data-cam="side" aria-pressed="false">Side</button>
          <button type="button" data-cam="front" aria-pressed="false">Front</button>
        </div>
        <button type="button" class="btn" id="ghost" aria-pressed="true">Motors shown</button>
        <div class="seg" id="platepick" hidden></div>
      </div>
      <div class="dims" id="dims"></div>
    </div>

    <div class="panel">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="secs"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="js/gait.js"></script>
<script src="js/geom.js"></script>
<script src="js/wheg.js"></script>
<script src="js/model.js"></script>
<script src="js/export3mf.js"></script>
<script>
(function () {
  'use strict';
  var M = WD.model, G = WD.geom, Gait = WD.gait, X = WD.export3mf, DEG = Math.PI / 180;
  var STORE = 'walker-designer-v2';
  var designs = {}, p = M.styleDefaults('crab'), d, parts, objs, an;
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') e.textContent = attrs[k]; else if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { e.appendChild(c); });
    return e;
  }
  function getPath(o, path) { return path.split('.').reduce(function (a, k) { return a[k]; }, o); }
  function setPath(o, path, v) { var ks = path.split('.'), last = ks.pop(); ks.reduce(function (a, k) { return a[k]; }, o)[last] = v; }

  // ------------------------------------------------------------------ saved designs (one per style)
  function save() {
    designs[p.style] = p;
    try { localStorage.setItem(STORE, JSON.stringify({ style: p.style, designs: designs })); } catch (e) {}
  }
  function mergeInto(base, src) {
    Object.keys(src || {}).forEach(function (k) {
      if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k]) && base[k] && typeof base[k] === 'object') mergeInto(base[k], src[k]);
      else if (Array.isArray(src[k]) && Array.isArray(base[k])) base[k] = src[k].slice();
      else base[k] = src[k];
    });
    return base;
  }
  function fromSaved(src) {
    var st = M.STYLES.indexOf(src && src.style) >= 0 ? src.style : 'crab';
    return M.clampParams(mergeInto(M.styleDefaults(st), src || {}));
  }
  try {
    var raw = localStorage.getItem(STORE);
    if (raw) {
      var st0 = JSON.parse(raw);
      Object.keys(st0.designs || {}).forEach(function (k) { designs[k] = fromSaved(st0.designs[k]); });
      p = designs[st0.style] || p;
    }
  } catch (e) { designs = {}; p = M.styleDefaults('crab'); }

  // ------------------------------------------------------------------ control definitions (kid words), per style
  var LEG_NAMES = { FL: 'Front-left', FR: 'Front-right', ML: 'Middle-left', MR: 'Middle-right', RL: 'Back-left', RR: 'Back-right' };
  var BODY_SLIDERS = [
    { k: 'extraLength', label: 'Longer body', unit: 'mm', hint: 'Adds room front to back.' },

  var LEG_SLIDERS = [

    { k: 'stanceAngle', label: 'Lower leg slope', unit: '°', hint: 'How far the lower leg tilts down from level.' },
    { k: 'legSplay', label: 'Point legs outward', unit: '°', hint: 'Small = legs point to the front and back. Big = legs point to the sides.' },
    { k: 'legWidth', label: 'Leg width', unit: 'mm', hint: 'Wider legs are stronger.' },
    { k: 'legThick', label: 'Leg thickness', unit: 'mm', hint: 'Thicker legs are stronger and heavier.' },

  ];
  var WALK = [
    { k: 'stride', label: 'Step size', unit: '°', hint: 'How far each foot swings forward and back.' },
    { k: 'lift', label: 'How high feet lift', unit: '°', hint: 'Bigger lifts clear bumps but make the robot wobble more.' },
    { k: 'period', label: 'Time for one full walk cycle', unit: 's', hint: 'Smaller = faster walker.' }
  ];
  var SWAY = { k: 'sway', label: 'Lean over standing legs', unit: '°', hint: 'Shifts weight onto the three feet that stay down. Helps a lot.' };
  var PANEL = {
    crab: [
      { id: 'shape', name: 'Body', intro: 'The body holds the brain, battery and four hip motors. Make it bigger to fit more.', sliders: BODY_SLIDERS, checks: ['corners', 'bed', 'floor'] },
      { id: 'legs', name: 'Legs', intro: 'Each leg has a hip motor and a knee motor. All four legs are printed the same.', sliders: LEG_SLIDERS, checks: ['muscle', 'thin', 'feet', 'foot', 'height'] },
      { id: 'walk', name: 'Walking', intro: 'Try changes while the robot walks. These numbers also go into the walking code.', sliders: WALK.concat([SWAY]), checks: ['stable', 'hiprange'] }
    ],
    hex: [
      { id: 'shape', name: 'Body', intro: 'The body holds the brain, battery and six hip motors. The middle motors sit beside the battery, so it is wider than the crab.', sliders: BODY_SLIDERS, checks: ['corners', 'bed', 'floor'] },
      { id: 'legs', name: 'Legs', intro: 'Six legs, all printed the same. Shorter lower legs put less strain on the motors.', sliders: LEG_SLIDERS, checks: ['muscle', 'thin', 'feet', 'foot', 'height'] },
      { id: 'walk', name: 'Walking', intro: 'Three legs step while three stand, then they swap. That keeps it steady without leaning.', sliders: WALK, checks: ['stable', 'hiprange'] }
    ],
    wheg: [
      { id: 'shape', name: 'Body', intro: 'The body is a tray with two walls that hold the four spin motors. A longer body leaves room for bigger spokes.',
        sliders: [BODY_SLIDERS[0], BODY_SLIDERS[1]], checks: ['floor', 'bed'] },
      { id: 'legs', name: 'Windmill legs', intro: 'Each leg is a hub with spokes that spins all the way round. The spokes grab and lift the robot over bumps. All four are printed the same.', sliders: [
        { k: 'spokeLen', label: 'Spoke length', unit: 'mm', hint: 'Longer spokes climb bigger bumps but need stronger motors and a longer body.' },
        { k: 'spokeCount', label: 'Number of spokes', unit: '', hint: 'More spokes ride smoother. Fewer spokes grab harder.' },
        { k: 'legWidth', label: 'Spoke width', unit: 'mm', hint: 'Wider spokes are stronger.' },
        { k: 'legThick', label: 'Spoke thickness', unit: 'mm', hint: 'Thicker spokes are stronger and heavier.' },
        { k: 'padSize', label: 'Tip pad size', unit: 'mm', hint: 'The round pad at the end of every spoke.' },
        { k: 'padWidth', label: 'Tip pad width', unit: 'mm', hint: 'Wide pads grip better and stop the robot sinking in soft ground.' }
      ], checks: ['wheelgap', 'height', 'thin', 'foot'] },
      { id: 'walk', name: 'Driving', intro: 'Spin motors turn all the way round, so there is no step size. Pick how fast they go.', sliders: [
        { k: 'maxThrottle', label: 'Top speed', unit: '%', mult: 100, hint: 'Start low. These motors are fast and the robot can flip over bumps.' }
      ], checks: ['speed', 'muscle', 'stable'] }
    ]
  };
  var BATTERY_FIELDS = [['battery.L', 'Battery holder length (mm)'], ['battery.W', 'Width (mm)'], ['battery.H', 'Height (mm)'], ['battery.mass', 'Weight with batteries (g)']];
  var PART_FIELDS = {
    servo: [['servo.L', 'Motor body length'], ['servo.W', 'Motor body width'], ['servo.H', 'Motor body height'], ['servo.tabSpan', 'Tab to tab length'],
            ['servo.tabThick', 'Tab thickness'], ['servo.tabFromTop', 'Tab depth from top'], ['servo.shaftOff', 'Shaft from end'], ['servo.holeSpan', 'Screw hole spacing']],
    board: [['board.L', 'Servo board length'], ['board.W', 'Servo board width'], ['board.H', 'Servo board height'], ['microbit.L', 'micro:bit length'], ['microbit.W', 'micro:bit width']]
  };
  var SWATCHES = [['Sky blue', '#3aa7ff'], ['Blue', '#1f4fd8'], ['Teal', '#14b8a6'], ['Lime', '#7ed321'], ['Green', '#1f9d55'], ['Yellow', '#ffd23f'],
                  ['Orange', '#ff8a1f'], ['Red', '#e5383b'], ['Pink', '#ff5fa2'], ['Purple', '#8a4fd8'], ['White', '#f4f4f0'], ['Black', '#262a33']];

  // ------------------------------------------------------------------ panel (rebuilt when the style changes)
  var tabsEl = $('tabs'), secs = $('secs'), outputs = {}, fieldInputs = {}, curTab = 'shape', tabList = [];
  function sliderRow(def) {
    var r = M.RANGES[def.k], id = 'sl-' + def.k, mult = def.mult || 1, out = el('output', { for: id });

    setCamera(m === 'plates' ? 'plates' : camName);
  }
  $('viewmode').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b && renderer) setMode(b.dataset.mode); });
  $('cam').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; camName = b.dataset.cam;
    Array.prototype.forEach.call($('cam').querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    setCamera(camName);
  });
  $('walk').addEventListener('click', function () {
    walking = !walking; this.classList.toggle('on', walking); this.setAttribute('aria-pressed', walking);
    this.textContent = walking ? (p.style === 'wheg' ? 'Driving' : 'Walking') : (p.style === 'wheg' ? 'Parked' : 'Standing');
    prevStanceX = null; if (!walking && legG && d.legs && p.style !== 'wheg') applyPose(standPoseNow());
  });
  $('ghost').addEventListener('click', function () {
    ghostOn = !ghostOn; this.textContent = ghostOn ? 'Motors shown' : 'Motors hidden'; this.classList.toggle('on', ghostOn); this.setAttribute('aria-pressed', ghostOn);
    ghosts.forEach(function (m) { m.visible = ghostOn; });
  });
  $('ghost').classList.add('on');

  function frame(t) {
    requestAnimationFrame(frame);
    if (!renderer || document.hidden) return;
    var dt = Math.min(0.05, (t - lastT) / 1000 || 0); lastT = t;
    if (mode === 'robot' && walking && walker && walker.style === p.style) {
      if (p.style === 'wheg') {
        var sp = walker.update(dt); applyWheels(walker.angle);
        var v = sp.FL * walker.rpmFull / 60 * 2 * Math.PI * 0.8 * d.R * dt;          // mm the ground slides back
        floorX -= v; floor.position.x = ((floorX % 20) + 20) % 20;
      } else if (legG.FL) {
        var pose = walker.update(dt); applyPose(pose);
        var sx = stanceX(pose);
        if (sx !== null && prevStanceX !== null) { floorX += sx - prevStanceX; floor.position.x = ((floorX % 20) + 20) % 20; }
        prevStanceX = sx;
      }
    }
    controls.update(); renderer.render(scene, camera);
  }

  // ------------------------------------------------------------------ refresh
  function renderChecks(ul, list) {
    ul.innerHTML = '';
    list.forEach(function (c) {
      ul.appendChild(el('li', {}, [el('span', { class: 'dot ' + c.level }), el('div', {}, [el('b', { text: c.title }), el('span', { text: c.detail })])]));
    });
  }
  function updateUI() {
    Array.prototype.forEach.call(stylesEl.querySelectorAll('.stylecard'), function (b) { b.setAttribute('aria-checked', b.dataset.style === p.style ? 'true' : 'false'); });
    Object.keys(outputs).forEach(function (k) {
      var o = outputs[k], v = p[k], dec = o.step < 1 ? 1 : 0;
      o.inp.value = v; o.out.textContent = (v * o.mult).toFixed(dec) + (o.unit ? ' ' + o.unit : '');
    });
    Object.keys(fieldInputs).forEach(function (path) { var v = getPath(p, path); if (document.activeElement !== fieldInputs[path]) fieldInputs[path].value = v; });
    if (document.activeElement !== $('rname')) $('rname').value = p.name;
    $('batpreset').value = p.batteryPreset;
    for (var i = 0; i < 4; i++) { $('slotchip' + i).style.background = p.ams[i].hex; $('slotname' + i).textContent = 'Slot ' + (i + 1) + ': ' + p.ams[i].name; }
    Array.prototype.forEach.call(document.querySelectorAll('.sw'), function (b) { b.setAttribute('aria-pressed', p.ams[+b.dataset.slot].hex === b.dataset.hex ? 'true' : 'false'); });
    function opts(sel, withSame) {
      sel.innerHTML = '';
      if (withSame) sel.appendChild(el('option', { value: 0, text: 'Same as its leg' }));
      for (var j = 0; j < 4; j++) sel.appendChild(el('option', { value: j + 1, text: 'Slot ' + (j + 1) + ' – ' + p.ams[j].name }));
    }
    ['body', 'trim'].concat(M.STYLE_INFO[p.style].legs).forEach(function (k) { var s = $('as-' + k); opts(s, false); s.value = p.slots[k]; });
    var fs = $('as-feet'); opts(fs, true); fs.value = p.slots.feet || 0;

    var stt = $('status'), n = { warn: 0, bad: 0 };
    an.checks.forEach(function (c) { if (c.level !== 'ok') n[c.level]++; });
    stt.className = 'status ' + an.worst; stt.innerHTML = '';
    stt.appendChild(el('span', { class: 'dot ' + an.worst }));
    stt.appendChild(el('span', { text: an.worst === 'ok' ? 'All checks green' : an.worst === 'warn' ? n.warn + ' to look at' : n.bad + ' to fix' }));
    tabList.forEach(function (t) {
      var lv = 'ok', list = an.checks.filter(function (c) { return t.checks.indexOf(c.id) >= 0; });
      list.forEach(function (c) { if (c.level === 'bad') lv = 'bad'; else if (c.level === 'warn' && lv !== 'bad') lv = 'warn'; });
      var dot = $('tabdot-' + t.id); dot.className = 'dot ' + lv; dot.hidden = lv === 'ok' || !t.checks.length;
      var box = $('tc-' + t.id); if (box) { box.hidden = !list.length; renderChecks(box.querySelector('ul'), list); }
    });
    if (curTab === 'finish') renderFinish();
  }
  function renderFinish() {
    renderChecks($('fchecks'), an.checks);
    var hours = (an.grams * 2.2 / 60).toFixed(1), fs = $('fstats'); fs.innerHTML = '';
    [[an.plates.length, 'print plates'], [an.grams.toFixed(0) + ' g', 'plastic'], ['~' + hours + ' h', 'print time (rough)'], [objs.length, 'pieces']].forEach(function (s) {
      fs.appendChild(el('div', { class: 'stat' }, [el('b', { text: String(s[0]) }), el('span', { text: s[1] })]));
    });
    $('fwnums').textContent = X.settingsText(p).trim();
    var bad = an.worst === 'bad'; $('make').disabled = bad;
    $('makenote').textContent = bad ? 'Fix the red items first. They stop the robot from working.' : an.worst === 'warn' ? 'You can still print. Yellow items are worth a look first.' : 'The zip has one print file per plate, your settings, and a read-me.';
  }

  var pending = 0;
  function rebuild() {
    pending = 0; M.clampParams(p);
    d = M.derive(p); parts = M.buildParts(p, d); objs = M.printObjects(p, d, parts); an = M.analyze(p, objs);
    if (renderer) { buildRobot(); buildPlates(); robot.visible = mode === 'robot'; plateGroup.visible = mode === 'plates'; if (mode === 'plates') setCamera('plates'); }
    updateUI(); save();
  }
  function changed(recenter) {
    if (!pending) pending = requestAnimationFrame(function () { rebuild(); if (recenter && renderer && mode === 'robot') setCamera(camName); });
  }

  // ------------------------------------------------------------------ toast + files
  var toastT;
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 4200); }
  function saveFile(filename, data, mime) {
    var viaCap = window.claude && window.claude.use ? window.claude.use('downloads') : Promise.resolve(null);
    return Promise.resolve(viaCap).then(function (dl) {
      if (dl && dl.save) return dl.save({ filename: filename, data: data }).then(function () { toast('Saved ' + filename); });
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: mime })); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000); toast('Saved ' + filename);
    }).catch(function (e) { if (!e || e.code !== 'declined') toast('Could not save the file. ' + ((e && e.message) || '')); });
  }
  function slug() { return (p.name || 'walker').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'walker'; }
  function makeFiles() {
    var b = $('make'); b.disabled = true; b.textContent = 'Making files...';
    X.buildZip(JSZip, M, p, { settings: true }).then(function (bytes) { return saveFile(slug() + '-print-files.zip', bytes, 'application/zip'); })
      .catch(function (e) { toast('Something went wrong making the files: ' + e.message); })
      .then(function () { b.textContent = 'Make my print files'; b.disabled = an.worst === 'bad'; });
  }
  function loadFile() {
    var f = this.files && this.files[0]; if (!f) return; var r = new FileReader(), inp = this;
    r.onload = function () {
      try {
        var j = JSON.parse(r.result), np = fromSaved(j.params || j);
        designs[p.style] = p; p = np; designs[p.style] = p;
        buildPanel(); buildPresets(); changed(true); toast('Opened ' + (p.name || 'design'));
      } catch (e) { toast('That file is not a Walker design.'); }
    };
    r.readAsText(f); inp.value = '';
  }
  var resetArmed = false;
  function resetClick() {
    var b = $('reset');
    if (!resetArmed) { resetArmed = true; b.textContent = 'Tap again to erase changes'; setTimeout(function () { resetArmed = false; if ($('reset')) $('reset').textContent = 'Start over'; }, 3500); return; }
    resetArmed = false; b.textContent = 'Start over'; var nm = p.name; p = M.styleDefaults(p.style); p.name = nm; changed(true);
  }

  // ------------------------------------------------------------------ go
  var ok = initScene();
  buildPanel(); buildPresets();
  rebuild();
  if (ok) { setMode('robot'); requestAnimationFrame(frame); }
  window.WDApp = {
    get p() { return p; }, get an() { return an; }, get d() { return d; }, set: function (k, v) { p[k] = v; rebuild(); },
    setStyle: function (st) { switchStyle(st); rebuild(); },
    rebuild: rebuild, showTab: showTab, setMode: setMode, applyPose: applyPose,
    footWorld: function (leg) {
      robot.updateMatrixWorld(true);
      return kneeG[leg].localToWorld(new THREE.Vector3(d.Qu - d.a, d.vFc, d.footBot - d.Kw)).toArray();
    },
    setWheel: function (angles) { applyWheels(angles); },
    wheelTips: function (leg) {
      robot.updateMatrixWorld(true); var out = [];
      for (var i = 0; i < d.n; i++) {
        var a = i * d.pitch * DEG, v = new THREE.Vector3(d.padCenterR * Math.cos(a), d.padCenterR * Math.sin(a), d.hubY0 + d.padW / 2);
        out.push(spinG[leg].localToWorld(v).toArray());
      }
      return out;
    }
  };
})();
</script>
</body>
</html>
